zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}
  include_path: null # Or set a list of glob patterns, e.g. ["2026/survey/**","2026/reading-group/**"]

email:
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  smtp_server: smtp.gmail.com
  smtp_port: 587
  sender_password: ${oc.env:SENDER_PASSWORD}
  subject: Weekly arXiv digest

llm:
  api_mode: claude_code # Summaries via the Claude Code CLI on the Claude subscription (CLAUDE_CODE_OAUTH_TOKEN in CI)
  generation_kwargs:
    model: opus
  claude_code:
    fallback_model: sonnet

source:
  arxiv:
    category: ["physics.chem-ph", "cond-mat.mtrl-sci", "physics.comp-ph", "cs.LG"]
    include_cross_list: true
    lookback_days: 7 # Weekly digest: papers first submitted in a 7-day window...
    lag_days: 2 # ...ending 2 days before the (Saturday) run
  chemrxiv:
    lookback_hours: 168

reranker:
  time_decay: false # Weight all Zotero papers equally, regardless of when they were added

executor:
  debug: ${oc.env:DEBUG,null}
  source: ['arxiv', 'chemrxiv']
  max_paper_num: 15
